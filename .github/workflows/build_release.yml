name: Moona Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tên tag phát hành (ví dụ: v0.6.0)'
        required: false
        default: 'v0.6.0'

jobs:
  build-and-release:
    name: Build & Publish Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 2. Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: 4. Khôi phục google-services.json từ GitHub Secret
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > android/app/google-services.json
            echo "[OK] Da giai ma google-services.json tu GitHub Secret."
          elif [ ! -f "android/app/google-services.json" ]; then
            echo "[!] Khong co secret GOOGLE_SERVICES_JSON_BASE64, dung google-services.json.example."
            cp android/app/google-services.json.example android/app/google-services.json
          fi

      - name: 5. Cài đặt Flutter Dependencies
        run: flutter pub get

      - name: 6. Kiểm tra chất lượng mã nguồn (Quality Gate)
        run: |
          flutter analyze
          flutter test

      - name: 7. Biên dịch APK Release tối ưu (arm64-v8a)
        run: flutter build apk --release --split-per-abi

      - name: 8. Biên dịch APK Release phổ thông (Universal)
        run: flutter build apk --release

      - name: 9. Chuẩn bị tệp tải về
        run: |
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release_assets/moona-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/moona-universal.apk
          ls -la release_assets/

      - name: 10. Xuất bản GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/moona-arm64-v8a.apk
            release_assets/moona-universal.apk
          name: Moona Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
